name: Bundle

on:
  push:
  repository_dispatch:
    types:
      - bundle

# A newer push to the same branch cancels the run it replaces. Each bundle request
# (repository_dispatch) gets a group of its own, so customers never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

# Only the release job writes; the rest read the repository.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare_config:
    name: Prepare configuration
    runs-on: ubuntu-latest
    outputs:
      bundle_name: ${{ steps.set_bundle_name_and_version.outputs.bundle_name }}
      bundle_version: ${{ steps.set_bundle_name_and_version.outputs.bundle_version }}
    steps:
      - name: Checkout config
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            config/
          sparse-checkout-cone-mode: false

      - name: Download and unpack configuration
        if: github.event.client_payload.configuration_url != ''
        run: |
          CONFIGURATION_URL=$(jq -r '.client_payload.configuration_url' $GITHUB_EVENT_PATH)
          echo "::add-mask::$CONFIGURATION_URL"

          curl -fL -o config.zip "$CONFIGURATION_URL"
          unzip -o -q config.zip -d config

      - name: Get bundle name and version
        id: set_bundle_name_and_version
        run: |
          echo "bundle_name=$(yq '.name' config/config.yaml)" >> $GITHUB_OUTPUT
          echo "bundle_version=$(yq '.version // "${{ github.ref_name }}"' config/config.yaml)" >> $GITHUB_OUTPUT

      - name: Encrypt configuration
        if: github.event.client_payload.configuration_url != ''
        env:
          CONFIG_ZIP_PASSWORD: ${{ secrets.CONFIG_ZIP_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
          -in config.zip -out config.zip.enc \
          -pass env:CONFIG_ZIP_PASSWORD

      - uses: actions/upload-artifact@v7
        name: Upload encrypted configuration
        if: github.event.client_payload.configuration_url != ''
        with:
          name: encrypted-configuration
          path: config.zip.enc

  bundle:
    name: Bundle ${{ needs.prepare_config.outputs.bundle_name }}${{ matrix.netplay && ' (Netplay)' || ''}} for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare_config
    # A build is around 10 minutes; this ends one stuck in notarization, say, long before
    # the 6-hour default.
    timeout-minutes: 45
    strategy:
      # One platform failing shouldn't cancel the others: a bundle request still gets
      # the platforms that built.
      fail-fast: false
      matrix:
        # NOTE: Should use the oldest available Ubuntu release, for maximum compatibility
        os: [windows-latest, macOS-15, ubuntu-22.04]
        netplay: [true, false]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      # Keyed by OS, toolchain and Cargo.lock, plus the netplay feature so the two builds per
      # OS don't evict each other; falls back to the closest earlier cache when the lock changes.
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.netplay && 'netplay' || 'local' }}

      # WiX 6, pinned: WiX 7 requires accepting the Open Source Maintenance Fee EULA.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 6.0.2
          TOOLS="$HOME/.dotnet/tools"
          cygpath -w "$TOOLS" >> "$GITHUB_PATH"
          "$TOOLS/wix" extension add --global WixToolset.UI.wixext/6.0.2

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev

      - name: Download encrypted configuration
        if: github.event.client_payload.configuration_url != ''
        uses: actions/download-artifact@v8
        with:
          name: encrypted-configuration

      - name: Decrypt and unpack configuration
        if: github.event.client_payload.configuration_url != ''
        env:
          CONFIG_ZIP_PASSWORD: ${{ secrets.CONFIG_ZIP_PASSWORD }}
        run: ./build_scripts/decrypt-config.sh --unpack

      - name: Set up paths and names
        run: |
          BUNDLE_VERSION="${{ needs.prepare_config.outputs.bundle_version }}"
          {
            echo "BINARIES_PATH=$RUNNER_TEMP/binaries"
            # From pwd rather than $GITHUB_WORKSPACE, which is a Windows path on Windows.
            echo "ARTIFACTS=$(pwd)/artifacts"
            echo "BUNDLE_CONFIG=$(pwd)/config"
            echo "FEATURE_FLAG=${{ matrix.netplay && '--features netplay' || '' }}"
            echo "SIMPLE_BUNDLE_NAME=${{ needs.prepare_config.outputs.bundle_name }}"
            echo "BUNDLE_NAME=${{ needs.prepare_config.outputs.bundle_name }} $BUNDLE_VERSION ${{ runner.os }}${{ matrix.netplay && ' Netplay' || '' }}"
            echo "BUNDLE_VERSION=$BUNDLE_VERSION"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/binaries" artifacts

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --locked --release $FEATURE_FLAG
          mv target/release/nes-bundler.exe "$BINARIES_PATH/nes-bundler.exe"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --target=x86_64-apple-darwin --target=aarch64-apple-darwin $FEATURE_FLAG
          lipo target/x86_64-apple-darwin/release/nes-bundler \
            target/aarch64-apple-darwin/release/nes-bundler \
            -create -output "$BINARIES_PATH/nes-bundler"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release $FEATURE_FLAG
          mv target/release/nes-bundler "$BINARIES_PATH/nes-bundler"

      - uses: apple-actions/import-codesign-certs@v7
        name: Import macOS certificates
        if: runner.os == 'macOS'
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Verify Certificate
        if: runner.os == 'macOS'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning signing_temp.keychain | grep "Developer ID Application")
          APPLE_SIGNING_IDENTITY=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir wix
          cp "$BINARIES_PATH/nes-bundler.exe" wix/
          # Bundle configurations made for WiX 3 carry its syntax; this brings them up to date,
          # and leaves current ones as they are. It exits with the number of changes made.
          wix convert "$BUNDLE_CONFIG/windows/wix/main.wxs" || true
          wix build "$BUNDLE_CONFIG/windows/wix/main.wxs" -ext WixToolset.UI.wixext -o "$BINARIES_PATH/nes-bundler.msi"

          cp "$BINARIES_PATH/nes-bundler.exe" "$ARTIFACTS/$BUNDLE_NAME.exe"
          cp "$BINARIES_PATH/nes-bundler.msi" "$ARTIFACTS/$BUNDLE_NAME Installer.msi"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          BUNDLE_APP_PATH="$RUNNER_TEMP/$SIMPLE_BUNDLE_NAME.app"
          mkdir -p "$BUNDLE_APP_PATH/Contents/MacOS" "$BUNDLE_APP_PATH/Contents/Resources"
          cp "$BUNDLE_CONFIG/macos/Info.plist" "$BUNDLE_APP_PATH/Contents/"

          iconutil "$BUNDLE_CONFIG/macos/bundle.iconset" -c icns --output "$BUNDLE_APP_PATH/Contents/Resources/bundle.icns"

          mv "$BINARIES_PATH/nes-bundler" "$BUNDLE_APP_PATH/Contents/MacOS/"

          codesign --force --options=runtime -s "$APPLE_SIGNING_IDENTITY" "$BUNDLE_APP_PATH/Contents/MacOS/nes-bundler"

          create-dmg \
            --volname "$SIMPLE_BUNDLE_NAME" \
            --volicon "$BUNDLE_APP_PATH/Contents/Resources/bundle.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$SIMPLE_BUNDLE_NAME.app" 200 170 \
            --hide-extension "$SIMPLE_BUNDLE_NAME.app" \
            --app-drop-link 600 165 \
            "$ARTIFACTS/$BUNDLE_NAME Installer.dmg" \
            "$BUNDLE_APP_PATH/"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # The release profile already strips the binary.
          tar czf "$ARTIFACTS/${BUNDLE_NAME}.tar.gz" -C "$BINARIES_PATH" nes-bundler

          # Pinned rather than `latest`: what runs here signs nothing, but it does build
          # what we ship.
          curl -fLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy
          curl -fLo linuxdeploy-plugin-appimage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-plugin-appimage

          export LDAI_OUTPUT=${BUNDLE_NAME}.AppImage
          ./linuxdeploy \
            --executable="$BINARIES_PATH/nes-bundler" \
            --desktop-file="$BUNDLE_CONFIG/linux/bundle.desktop" \
            --appdir=AppDir \
            --icon-file="$BUNDLE_CONFIG/linux/icon_256x256.png" \
            --output=appimage
          mv "${BUNDLE_NAME}.AppImage" "$ARTIFACTS/"

      - name: Sign and notarize macOS artifacts
        if: runner.os == 'macOS'
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUNDLE_APPLE_TEAM_ID: ${{ secrets.BUNDLE_APPLE_TEAM_ID }}
          BUNDLE_APPLE_USER: ${{ secrets.BUNDLE_APPLE_USER }}
          BUNDLE_APPLE_APP_PASSWORD: ${{ secrets.BUNDLE_APPLE_APP_PASSWORD }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

          ARTIFACT="$ARTIFACTS/$BUNDLE_NAME Installer.dmg"

          xcrun notarytool submit \
            --team-id "$BUNDLE_APPLE_TEAM_ID" \
            --apple-id "$BUNDLE_APPLE_USER" \
            --password "$BUNDLE_APPLE_APP_PASSWORD" \
            --wait "$ARTIFACT"

          xcrun stapler staple "$ARTIFACT"

      - name: Sign and notarize Windows artifacts
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: nes-bundler-signing
          certificate-profile-name: net-bundler
          files: |
            ${{ github.workspace }}\artifacts\${{ env.BUNDLE_NAME }} Installer.msi
            ${{ github.workspace }}\artifacts\${{ env.BUNDLE_NAME }}.exe

      - uses: actions/upload-artifact@v7
        name: Upload artifacts
        if: github.event.client_payload.configuration_url == ''
        with:
          name: ${{ matrix.os }}${{ matrix.netplay && '-netplay' || ''}}
          path: artifacts/*

      - name: Upload files for email
        if: github.event.client_payload.recipient_email != ''
        run: |
          shopt -s nullglob
          for ARTIFACT in artifacts/*; do
              ./build_scripts/upload.sh "$FILE_BIN" "$ARTIFACT" &
          done
          wait

  send_email:
    name: Send email
    if: ${{ !cancelled() && github.event.client_payload.recipient_email != '' }}
    needs:
      - bundle
      - prepare_config
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted configuration
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          name: encrypted-configuration

      - name: Decrypt configuration and get the bin
        if: ${{ !cancelled() }}
        env:
          CONFIG_ZIP_PASSWORD: ${{ secrets.CONFIG_ZIP_PASSWORD }}
        run: ./build_scripts/decrypt-config.sh

      - name: Get email address
        if: ${{ !cancelled() }}
        run: |
          RECIPIENT_EMAIL="$(jq -r '.client_payload.recipient_email' $GITHUB_EVENT_PATH)"
          echo "::add-mask::$RECIPIENT_EMAIL"
          echo "RECIPIENT_EMAIL=$RECIPIENT_EMAIL" >> $GITHUB_ENV

      # The download link if every platform built, otherwise where to find out what failed.
      - name: Email bundle
        if: ${{ !cancelled() }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ env.RECIPIENT_EMAIL }}
          from: NES Bundler <${{ secrets.MAIL_USERNAME }}>
          subject: ${{ needs.bundle.result == 'success' && format('Your bundle for {0} is ready!', needs.prepare_config.outputs.bundle_name) || format('There was a problem bundling {0}.', needs.prepare_config.outputs.bundle_name) }}
          html_body: ${{ needs.bundle.result == 'success' && format('<p>Click <a href="https://filebin.net/{0}/">here</a> to download all the bundles.</p><p>Thanks for using <a href="https://nes-bundler.com">NES Bundler</a>!</p>', env.FILE_BIN) || format('<p>See <a href="{0}/{1}/actions/runs/{2}">the build</a> for details.</p>', github.server_url, github.repository, github.run_id) }}

  release:
    name: Release
    needs: bundle
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Nes Bundler ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: "artifacts/*"
