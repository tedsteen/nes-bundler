[package]
name = "nes-bundler"
description = ""
version = "1.5.0"
authors = ["Ted Steen <ted.steen@gmail.com>"]
edition = "2024"
publish = false

[features]
default = []

netplay = [
  "matchbox_socket",
  "ggrs",
  "futures-timer",
  "uuid",
  "reqwest",
  "md5",
  "async-tungstenite",
  "serde_json",
]
debug = ["egui_plot", "puffin", "puffin_egui"]

# Playable framerates in development
[profile.dev]
opt-level = 1
# codegen-backend = "cranelift"
panic = 'unwind'
debug = true
strip = false

[profile.profiling]
inherits = "release"
panic = 'unwind'
debug = true
strip = false

[profile.release]
codegen-units = 1
#lto = true #TODO: This adds a lot of time to the build.. Perhaps not worth it?
strip = true
panic = 'abort'

[dependencies]
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
bitflags = "2"
rand = "0.10"

tokio = { version = "1", features = [
  "rt",
  "macros",
  "sync",
  "time",
] }
futures = "0.3"

egui = { version = "0.37", default-features = false, features = [
  "bytemuck",
  "default_fonts",
] }
egui_plot = { version = "0.38", optional = true }

# TODO: Use crates.io puffin and puffin_egui once a release supports egui 0.37 (puffin_egui 0.30 is on egui 0.33)
puffin = { git = "https://github.com/EmbarkStudios/puffin.git", rev = "39c8970abd6a95871bcaf0d3581c494885f2edd5", optional = true }
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin.git", rev = "39c8970abd6a95871bcaf0d3581c494885f2edd5", optional = true }

egui-winit = "0.37"
egui-wgpu = "0.37"
winit = "0.30"
wgpu = { version = "30", features = ["dx12", "metal"] }
raw-window-handle = "0.6"

sdl3 = { version = "0.22", features = ["build-from-source-static"] }

tetanes-core = "0.17"
thingbuf = "0.1"
ringbuf = "0.6"

base64 = "0.23"
directories = "6.0"

# Netplay deps
matchbox_socket = { version = "0.15", features = ["ggrs"], optional = true }
futures-timer = { version = "3", features = ["wasm-bindgen"], optional = true }
ggrs = { version = "0.13", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"], optional = true }
md5 = { version = "0.8", optional = true }
# For our copy of matchbox's signaller (src/netplay/signaller.rs); same versions as matchbox_socket.
async-tungstenite = { version = "0.35", default-features = false, features = ["smol-runtime"], optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
anyhow = "1.0"
serde_yaml_ng = "0.10"
serde = { version = "1.0", features = ["derive"] }
tinytemplate = "1.2"
winres = "0.1"
